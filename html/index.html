<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私人文件服务器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#102c43,transparent 30%),#07101d;color:#e9f1ff;font:15px system-ui,"Microsoft YaHei",sans-serif}.app{max-width:1300px;margin:auto;padding:22px}header,.toolbar,.crumbs,.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}header{margin-bottom:18px}h1{font-size:22px;margin:0}small,.muted{color:#8196b2}button,.btn{border:1px solid #2b405e;border-radius:10px;padding:10px 13px;background:#0d1c30;color:#dceaff;cursor:pointer;text-decoration:none}button:hover,.btn:hover{border-color:#4cbfff}.primary{border:0;background:linear-gradient(120deg,#19b9ff,#7959ff);font-weight:bold}.panel{padding:18px;margin:15px 0;background:#0b1729d9;border:1px solid #ffffff12;border-radius:17px;box-shadow:0 14px 50px #0003}.search{flex:1;min-width:200px}input{height:42px;padding:0 12px;border-radius:10px;border:1px solid #2b405e;background:#071323;color:white}.drop{display:block;text-align:center;border:1px dashed #3d5b7e;padding:25px;border-radius:15px;background:#0b2036;cursor:pointer}.drop.drag{border-color:#47c7ff;background:#123452}.picker{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.crumbs{justify-content:flex-start;margin-bottom:15px}.crumb{color:#63caff;cursor:pointer}.row{display:grid;grid-template-columns:minmax(180px,1fr) 100px 190px 140px;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #ffffff0e}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.actions{display:flex;gap:6px;justify-content:flex-end}.mini{font-size:12px;padding:7px}.danger{color:#ff9ba5}.upload{padding:12px;border:1px solid #243a56;border-radius:12px;margin:8px 0}.bar{height:7px;background:#182b42;border-radius:10px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#19b9ff,#7959ff);width:0}.empty{text-align:center;padding:35px;color:#8196b2}@media(max-width:700px){.row{grid-template-columns:1fr 70px 110px}.row .time{display:none}.row .actions{grid-column:2/-1}}
</style></head><body><div class="app"><header><div><h1>☁️ 私人文件服务器</h1><small id="who">验证登录…</small></div><div class="toolbar"><button id="newFolder">＋ 新建文件夹</button><button id="refresh">刷新</button><button id="logout">退出登录</button></div></header>
<section class="panel"><div class="toolbar"><input id="query" class="search" placeholder="搜索文件名或路径"><button id="search">搜索</button><button id="clear">清除</button></div><p class="muted" id="config">读取配置…</p></section>
<section class="panel"><div id="breadcrumbs" class="crumbs"></div><label id="dropArea" class="drop" for="filePicker"><div style="font-size:32px">⬆️</div><strong>拖拽文件到这里，或点击选择文件</strong><p class="muted">支持多文件、并发分片上传与已上传分片跳过</p><span class="btn primary">选择文件</span><input id="filePicker" class="picker" type="file" multiple></label></section>
<section class="panel"><div id="uploads"></div><div id="fileList"></div></section></div>
<script>
const $=id=>document.getElementById(id);let currentPath='',config={};
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatSize(n){if(n<1024)return n+' B';const units=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<3);return n.toFixed(1)+' '+units[i]}
async function api(url,options={}){const response=await fetch(url,options);let data={};try{data=await response.json()}catch{}if(response.status===401){location.href='/login.html';throw Error('登录已失效')}if(!response.ok)throw Error(data.error||'请求失败');return data}
async function boot(){try{const me=await api('/api/me');$('who').textContent='已登录：'+me.username;config=await api('/api/config');$('config').textContent='分片 '+config.chunk_size_text+' · 并发 '+config.concurrency+' · 单文件最大 '+config.max_upload_size_text;await loadFiles()}catch(error){$('fileList').textContent=error.message}}
function renderBreadcrumbs(){let html='<span class="crumb" data-path="">根目录</span>',prefix='';for(const part of currentPath.split('/').filter(Boolean)){prefix+=(prefix?'/':'')+part;html+=' / <span class="crumb" data-path="'+escapeHtml(prefix)+'">'+escapeHtml(part)+'</span>'}$('breadcrumbs').innerHTML=html;$('breadcrumbs').querySelectorAll('[data-path]').forEach(el=>el.onclick=()=>{currentPath=el.dataset.path;loadFiles()})}
async function loadFiles(){try{const data=await api('/api/list?path='+encodeURIComponent(currentPath));renderBreadcrumbs();renderItems(data.items)}catch(error){$('fileList').textContent=error.message}}
function renderItems(items){if(!items.length){$('fileList').innerHTML='<div class="empty">当前目录为空</div>';return}$('fileList').innerHTML='<div class="row muted"><span>名称</span><span>大小</span><span class="time">修改时间</span><span></span></div>'+items.map(item=>'<div class="row"><span class="name" data-path="'+escapeHtml(item.path)+'" data-type="'+item.type+'">'+(item.type==='folder'?'📁':'📄')+' '+escapeHtml(item.name)+'</span><span class="muted">'+(item.type==='folder'?'—':formatSize(item.size))+'</span><span class="muted time">'+new Date(item.mtime*1000).toLocaleString()+'</span><span class="actions">'+(item.type==='file'?'<a class="btn mini" target="_blank" href="/files/'+item.path.split('/').map(encodeURIComponent).join('/')+'">下载</a>':'')+'<button class="mini danger" data-delete="'+escapeHtml(item.path)+'">删除</button></span></div>').join('');$('fileList').querySelectorAll('[data-type="folder"]').forEach(el=>el.onclick=()=>{currentPath=el.dataset.path;loadFiles()});$('fileList').querySelectorAll('[data-delete]').forEach(el=>el.onclick=async()=>{if(confirm('确定删除 '+el.dataset.delete+'？')){try{await api('/api/delete',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:el.dataset.delete})});await loadFiles()}catch(e){alert(e.message)}}})}
async function runSearch(){const q=$('query').value.trim();if(!q)return loadFiles();try{const data=await api('/api/search?q='+encodeURIComponent(q));$('breadcrumbs').textContent='搜索结果';renderItems(data.items)}catch(e){alert(e.message)}}
$('search').onclick=runSearch;$('query').onkeydown=e=>{if(e.key==='Enter')runSearch()};$('clear').onclick=()=>{$('query').value='';loadFiles()};$('refresh').onclick=loadFiles;
$('newFolder').onclick=async()=>{const name=prompt('文件夹名称');if(name){try{await api('/api/folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:(currentPath?currentPath+'/':'')+name})});await loadFiles()}catch(e){alert(e.message)}}};
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login.html'};
function uploadCard(file){const el=document.createElement('div');el.className='upload';el.innerHTML='<div class="top"><b>'+escapeHtml(file.name)+'</b><span class="status">准备中</span></div><p class="muted meta">0 / '+formatSize(file.size)+'</p><div class="bar"><i></i></div>';$('uploads').prepend(el);return el}
async function uploadFile(file){const el=uploadCard(file),status=el.querySelector('.status');try{const task=await api('/api/upload/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,size:file.size,folder:currentPath})});const state=await api('/api/upload/status?upload_id='+task.upload_id);const done=new Set(state.uploaded_chunks);let uploaded=state.uploaded_bytes;const start=performance.now();function update(){const percent=file.size?uploaded/file.size*100:100,seconds=(performance.now()-start)/1000,speed=seconds?uploaded/seconds:0,remaining=speed?(file.size-uploaded)/speed:0;el.querySelector('i').style.width=percent+'%';status.textContent=Math.round(percent)+'%';el.querySelector('.meta').textContent=formatSize(uploaded)+' / '+formatSize(file.size)+' · '+formatSize(speed)+'/s · 剩余 '+Math.ceil(remaining)+' 秒 · 并发 '+task.concurrency}update();let next=0;async function worker(){while(true){let index=-1;while(next<task.chunk_count){const candidate=next++;if(!done.has(candidate)){index=candidate;break}}if(index<0)return;const blob=file.slice(index*task.chunk_size,Math.min((index+1)*task.chunk_size,file.size));await api('/api/upload/chunk?upload_id='+task.upload_id+'&index='+index,{method:'PUT',headers:{'Content-Type':'application/octet-stream'},body:blob});done.add(index);uploaded+=blob.size;update()}}await Promise.all(Array.from({length:Math.min(task.concurrency,task.chunk_count)},worker));status.textContent='正在合并…';const result=await api('/api/upload/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({upload_id:task.upload_id})});el.querySelector('i').style.width='100%';status.textContent='完成';el.querySelector('.meta').textContent=formatSize(result.size)+' · 上传完成';setTimeout(()=>el.remove(),5000);await loadFiles()}catch(error){status.textContent='失败';status.style.color='#ff9ba5';el.querySelector('.meta').textContent=error.message}}
function addFiles(fileList){Array.from(fileList).forEach(uploadFile)}
$('filePicker').addEventListener('change',event=>{addFiles(event.target.files);event.target.value=''});$('dropArea').addEventListener('dragover',event=>{event.preventDefault();$('dropArea').classList.add('drag')});$('dropArea').addEventListener('dragleave',()=>$('dropArea').classList.remove('drag'));$('dropArea').addEventListener('drop',event=>{event.preventDefault();$('dropArea').classList.remove('drag');addFiles(event.dataTransfer.files)});
boot();
</script></body></html>
