<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私人文件服务器 - 登录</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#173754,#07101d 55%);color:#e9f1ff;font:16px system-ui,"Microsoft YaHei",sans-serif}.card{width:min(420px,92vw);padding:32px;border:1px solid #ffffff20;border-radius:20px;background:#0b1729e8;box-shadow:0 25px 90px #0008}h1{margin:10px 0}p{color:#8ea5c3}label{display:block;margin:18px 0 7px;color:#9eb0c9;font-size:13px}input{width:100%;height:48px;padding:0 13px;border-radius:11px;border:1px solid #2b405e;background:#071323;color:white}button{width:100%;height:49px;margin-top:22px;border:0;border-radius:12px;color:white;font-weight:700;background:linear-gradient(120deg,#19b9ff,#7959ff);cursor:pointer}#err{min-height:22px;color:#ff9da9;margin-top:12px;text-align:center}.logo{font-size:36px}
</style></head><body><main class="card"><div class="logo">☁️</div><h1>私人文件服务器</h1><p>登录以访问你的文件</p><form id="loginForm"><label for="username">用户名</label><input id="username" value="admin" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="submitButton">登录</button><div id="errorMessage"></div></form></main>
<script>
const form=document.getElementById('loginForm'),button=document.getElementById('submitButton'),error=document.getElementById('errorMessage');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='登录中…';error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'登录失败');location.href='/'}catch(err){error.textContent=err.message}finally{button.disabled=false;button.textContent='登录'}});
</script></body></html>
