<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>私人文件服务器 · 安全登录</title>
<style>
:root{color-scheme:dark;--text:#edf4ff;--muted:#8fa3bf;--line:#ffffff18;--cyan:#4ad8ff;--violet:#8c70ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;background:#070d18;color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body:before,body:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(2px);z-index:-1}
body:before{width:560px;height:560px;top:-260px;left:-170px;background:radial-gradient(circle,#145d82a8 0,transparent 68%)}
body:after{width:620px;height:620px;right:-280px;bottom:-320px;background:radial-gradient(circle,#5639a87a 0,transparent 68%)}
.ambient{position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(#7898bd12 1px,transparent 1px),linear-gradient(90deg,#7898bd12 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
.layout{width:min(100%,960px);display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:56px}
.intro{padding:16px 0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;font-weight:700;letter-spacing:.04em}
.logo{width:48px;height:48px;display:grid;place-items:center;border:1px solid #65d9ff5c;border-radius:16px;background:linear-gradient(145deg,#1b73904a,#6e55c52b);box-shadow:0 0 35px #20bfff16;font-size:25px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:#6bdfff;text-transform:uppercase}
h1{font-size:clamp(32px,4.5vw,48px);line-height:1.12;letter-spacing:-.045em;margin:0 0 20px;font-weight:750}
h1 span{display:block;color:#80dcff}
.lead{max-width:390px;color:var(--muted);font-size:16px;line-height:1.9;margin:0}
.features{display:grid;gap:14px;margin-top:32px}
.feature{display:flex;align-items:center;gap:12px;color:#b7c7dc;font-size:13px}
.feature-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#ffffff08;border:1px solid var(--line);color:#82dcff}
.card{padding:34px;border:1px solid #ffffff20;border-radius:24px;background:linear-gradient(150deg,#132239eF,#0a1424f5);box-shadow:0 28px 100px #0007, inset 0 1px #ffffff0b;backdrop-filter:blur(18px)}
.card-head{margin-bottom:28px}
.card-head .eyebrow{margin-bottom:8px}
h2{font-size:25px;letter-spacing:-.025em;margin:0 0 8px}
.card-head p{margin:0;color:var(--muted);font-size:13px}
label{display:block;margin:20px 0 8px;color:#c5d3e6;font-size:13px;font-weight:600}
.field{position:relative}
.field .field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7792b2;font-size:16px;pointer-events:none}
input{width:100%;height:50px;padding:0 14px 0 43px;border-radius:12px;border:1px solid #344862;background:#081321;color:#f3f7ff;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#45cfff;box-shadow:0 0 0 3px #36c9ff18}
input::placeholder{color:#60758f}
button{width:100%;height:51px;margin-top:25px;border:0;border-radius:12px;color:#071323;font:700 15px inherit;font-weight:750;letter-spacing:.01em;background:linear-gradient(105deg,#58e0ff,#8b85ff);cursor:pointer;box-shadow:0 8px 28px #4a8fff2a;transition:transform .18s,filter .18s,opacity .18s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:translateY(0)}button:disabled{opacity:.65;cursor:wait;transform:none}
#err{min-height:22px;margin-top:12px;text-align:center;color:#ff9eae;font-size:13px}
.security{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;color:#7086a2;font-size:11px}
footer{grid-column:1/-1;text-align:center;color:#5f728c;font-size:11px;margin-top:-24px}
@media(max-width:720px){body{overflow:auto}.layout{max-width:430px;grid-template-columns:1fr;gap:24px}.intro{padding:0}.brand{margin-bottom:22px}.intro h1{font-size:30px;margin-bottom:12px}.lead,.features{display:none}.card{padding:26px 22px}.card-head{margin-bottom:20px}footer{margin-top:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div class="ambient"></div>
<main class="layout">
<section class="intro">
 <div class="brand"><div class="logo">☁</div><div><div>PRIVATE CLOUD</div><div class="eyebrow">PERSONAL FILE SPACE</div></div></div>
 <h1>你的文件，<span>随时安全访问。</span></h1>
 <p class="lead">一个简洁、私密的个人文件空间。上传、整理与下载，让文件管理保持简单有序。</p>
 <div class="features"><div class="feature"><span class="feature-icon">↥</span>大文件分片上传与实时进度</div><div class="feature"><span class="feature-icon">⌁</span>文件夹整理与快速搜索</div><div class="feature"><span class="feature-icon">◈</span>登录验证与 HTTPS 安全连接</div></div>
</section>
<section class="card">
 <div class="card-head"><div class="eyebrow">WELCOME BACK</div><h2>登录文件空间</h2><p>请输入你的账户信息以继续。</p></div>
 <form id="loginForm">
  <label for="username">用户名</label><div class="field"><span class="field-icon">♙</span><input id="username" value="admin" autocomplete="username" placeholder="输入用户名" required></div>
  <label for="password">密码</label><div class="field"><span class="field-icon">⌑</span><input id="password" type="password" autocomplete="current-password" placeholder="输入登录密码" required></div>
  <button id="submitButton" type="submit">安全登录　→</button><div id="err" role="alert" aria-live="polite"></div>
 </form>
 <div class="security"><span>◇</span> 登录会话受保护 · 请勿在公共设备保存密码</div>
</section>
<footer>PRIVATE FILE SERVER <span>·</span> PERSONAL STORAGE, YOUR CONTROL</footer>
</main>
<script>
const form=document.getElementById('loginForm'),button=document.getElementById('submitButton'),error=document.getElementById('err');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='正在验证…';error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'登录失败');location.href='/'}catch(err){error.textContent=err.message}finally{button.disabled=false;button.textContent='安全登录　→'}});
</script>
</body></html>
