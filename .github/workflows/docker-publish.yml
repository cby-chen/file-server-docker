name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: file-server-image-main
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHCR_IMAGE: ghcr.io/cby-chen/file-server-docker

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate readable image tag (China Standard Time)
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          echo "value=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Validate source and optional ACR configuration
        shell: bash
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -f app/Dockerfile
          test -f app/app.py
          test -f app/requirements.txt
          python3 -m py_compile app/app.py

          # ACR is optional; if any ACR setting is supplied, require all four.
          configured=0
          for value in "$ACR_REGISTRY" "$ACR_IMAGE" "$ACR_USERNAME" "$ACR_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "::error::ACR is partially configured. Set ACR_REGISTRY and ACR_IMAGE variables, plus ACR_USERNAME and ACR_PASSWORD secrets."
            exit 1
          fi
          if [ "$configured" -eq 4 ]; then
            case "$ACR_IMAGE" in
              "$ACR_REGISTRY"/*) ;;
              *) echo "::error::ACR_IMAGE must start with ACR_REGISTRY/"; exit 1 ;;
            esac
            if [[ "$ACR_IMAGE" == *:* ]]; then
              echo "::error::ACR_IMAGE must not include a tag"; exit 1
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          tags: file-server-ci:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=file-server
          cache-to: type=gha,mode=max,scope=file-server

      - name: Smoke test /health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name file-server-ci-test \
            -p 127.0.0.1:5000:5000 \
            -e SECRET_KEY=ci-only-test-secret \
            -e FILE_PASSWORD=ci-only-test-password \
            file-server-ci:${GITHUB_SHA}
          cleanup() { docker rm -f file-server-ci-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs file-server-ci-test
          echo "::error::Container health check failed"
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/cby-chen/file-server-docker:${{ steps.tag.outputs.value }}
            ghcr.io/cby-chen/file-server-docker:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cby-chen/file-server-docker
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=file-server
          cache-to: type=gha,mode=max,scope=file-server

      - name: Login to Alibaba Cloud ACR
        if: ${{ vars.ACR_REGISTRY != '' && vars.ACR_IMAGE != '' && secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and publish to Alibaba Cloud ACR
        if: ${{ vars.ACR_REGISTRY != '' && vars.ACR_IMAGE != '' && secrets.ACR_USERNAME != '' && secrets.ACR_PASSWORD != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ vars.ACR_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cby-chen/file-server-docker
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=file-server
          cache-to: type=gha,mode=max,scope=file-server

      - name: Print image tags
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.value }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "GHCR: ghcr.io/cby-chen/file-server-docker:$TAG"
          echo "GHCR: ghcr.io/cby-chen/file-server-docker:latest"
          if [ -n "$ACR_REGISTRY" ] && [ -n "$ACR_IMAGE" ] && [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
            echo "ACR: $ACR_IMAGE:$TAG"
            echo "ACR: $ACR_IMAGE:latest"
          else
            echo "ACR: skipped (configure repository Actions variables/secrets to enable)"
          fi
